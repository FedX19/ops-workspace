name: Run DEV migrations

on:
  workflow_dispatch:
  push:
    branches:
      - develop

jobs:
  run-migrations:
    name: Run migrations (DEV only)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install psql
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Run migrations via psql
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -e
          for f in migrations/*_create_*.sql migrations/000_enable_pgcrypto.sql; do
            echo "Applying $f"
            psql "$SUPABASE_DB_URL" -f "$f"
          done
